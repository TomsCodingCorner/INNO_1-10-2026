services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zorgagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/setup.py first}
      POSTGRES_DB: ${POSTGRES_DB:-zorgagent}
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zorgagent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zorgagent}
      IDENTITY_DATABASE_URL: postgresql://${POSTGRES_USER:-zorgagent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zorgagent}
      REVIEWER_KEY: ${REVIEWER_KEY:?Run python scripts/setup.py first}
      INTERNAL_KEY: ${INTERNAL_KEY:?Run python scripts/setup.py first}
      DEMO_MODE: ${DEMO_MODE:-true}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/wmo-aanvraag
    volumes:
      - ./data/app:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:1.112.6}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: Europe/Amsterdam
      TZ: Europe/Amsterdam
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run python scripts/setup.py first}
      INTERNAL_KEY: ${INTERNAL_KEY:?Run python scripts/setup.py first}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-zorgagent}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/setup.py first}
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
